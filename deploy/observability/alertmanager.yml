# Alertmanager routing for the mcp-azure-devops alerts (severity: warning|critical).
#
# Alertmanager does NOT expand env vars in YAML — replace the placeholders below
# with your real endpoints (or mount them via the *_file variants, e.g.
# `slack_api_url_file` / `routing_key_file`, and render with your secret store).
# Validate: amtool check-config deploy/observability/alertmanager.yml
global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/REPLACE_ME"

route:
  receiver: slack-default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Page on critical; Slack on warning.
    - matchers: ['severity="critical"']
      receiver: pagerduty-critical
      continue: true # also post to Slack
    - matchers: ['severity="critical"']
      receiver: slack-critical
    - matchers: ['severity="warning"']
      receiver: slack-default

receivers:
  - name: slack-default
    slack_configs:
      - channel: "#alerts-mcp"
        send_resolved: true
        title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

  - name: slack-critical
    slack_configs:
      - channel: "#alerts-mcp-critical"
        send_resolved: true
        title: '🔴 {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "REPLACE_WITH_PAGERDUTY_ROUTING_KEY"
        send_resolved: true
        description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'

inhibit_rules:
  # A firing critical for an alert silences the matching warning.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["alertname"]
