# Default values for mcp-azure-devops.

replicaCount: 2

image:
  repository: mcp-azure-devops
  tag: "3.0.0"
  # Pin by digest for immutable deploys (overrides tag when set), e.g.:
  # digest: "sha256:..."
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

# Non-secret configuration -> injected as env (ConfigMap).
config:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "4000"
  TRUST_PROXY: "1" # behind an ingress/LB
  AZURE_ORG: ""
  AZURE_PROJECT: ""
  AZURE_MAX_CONCURRENCY: "6"
  LLM_ENABLED: "false"
  LLM_MODEL: claude-haiku-4-5
  LLM_MONTHLY_BUDGET_USD: "25"
  LLM_REDACT_INPUT: "true"
  # OIDC (optional; set OIDC_ISSUER to enable JWT auth alongside service tokens)
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: ""
  OIDC_JWKS_URL: ""
  OIDC_REQUIRED_SCOPE: ""

# Secrets. For production, leave these empty and provide the Secret out-of-band
# (existingSecret) via an external-secrets operator / CSI driver / sealed-secrets.
secrets:
  # Name of a pre-existing Secret with keys AZURE_PAT, ANTHROPIC_API_KEY,
  # API_TOKENS (and optionally METRICS_TOKEN). Takes precedence when set.
  existingSecret: ""
  # Inline values (dev/test only — discouraged for prod; they land in the release).
  create: true
  data:
    AZURE_PAT: ""
    ANTHROPIC_API_KEY: ""
    API_TOKENS: "" # "name:secret,name2:secret2"
    METRICS_TOKEN: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

# Bundled Redis (single replica) for non-prod. In prod, disable this and point
# config.REDIS_URL (below) at a managed/HA Redis.
redis:
  enabled: false
  image: redis:7-alpine
# External/managed Redis URL (used when redis.enabled is false). Empty = in-process store.
redisUrl: ""

networkPolicy:
  enabled: false
  # Namespace label selector allowed to reach the service (e.g. ingress controller).
  ingressNamespaceLabel: { kubernetes.io/metadata.name: ingress-nginx }

metrics:
  serviceMonitor:
    enabled: false # requires the Prometheus Operator CRDs
    interval: 30s
    # If METRICS_TOKEN is set in secrets, the ServiceMonitor sends it as a bearer.
  prometheusRule:
    enabled: false # requires the Prometheus Operator CRDs; ships alert+recording rules
    labels: {} # e.g. { release: kube-prometheus-stack } so your Prometheus selects it

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
