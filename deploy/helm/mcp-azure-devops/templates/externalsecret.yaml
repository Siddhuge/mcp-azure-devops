{{- if .Values.externalSecrets.enabled }}
# Pull secrets from your external store (AWS Secrets Manager, Vault, Azure Key
# Vault, GCP SM, …) via the External Secrets Operator. Produces a Secret named
# like the app so the Deployment's *_FILE mounts resolve. Requires the ESO CRDs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ include "app.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
        {{- with .remoteProperty }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
