{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  # All keys are created (empty allowed) so the *_FILE mounts always resolve.
  AZURE_PAT: {{ .Values.secrets.data.AZURE_PAT | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.data.ANTHROPIC_API_KEY | default "" | quote }}
  API_TOKENS: {{ .Values.secrets.data.API_TOKENS | default "" | quote }}
  METRICS_TOKEN: {{ .Values.secrets.data.METRICS_TOKEN | default "" | quote }}
{{- end }}
