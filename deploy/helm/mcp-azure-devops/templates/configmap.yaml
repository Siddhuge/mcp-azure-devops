apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- with (include "app.redisUrl" .) }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
  # Source secrets from mounted files (the app's *_FILE convention).
  AZURE_PAT_FILE: /run/secrets/app/AZURE_PAT
  ANTHROPIC_API_KEY_FILE: /run/secrets/app/ANTHROPIC_API_KEY
  API_TOKENS_FILE: /run/secrets/app/API_TOKENS
  METRICS_TOKEN_FILE: /run/secrets/app/METRICS_TOKEN
  TMPDIR: /tmp
