services:
  mcp-azure-devops:
    build: .
    image: mcp-azure-devops:latest
    container_name: mcp-azure-devops
    init: true # forward signals / reap zombies even without tini
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    read_only: true # immutable rootfs; app writes nothing to disk
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 300M
