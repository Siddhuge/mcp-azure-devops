name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Gate on production dependencies (what actually ships). Dev-only tooling
      # CVEs are reported but non-blocking (not in the runtime image).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (non-blocking, visibility)
        run: npm audit || true
      - name: Build image
        run: docker build -t mcp-azure-devops:ci .
      - name: Scan image for HIGH/CRITICAL CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mcp-azure-devops:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mcp-azure-devops:ci
          format: cyclonedx
          output: sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
